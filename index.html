    .passage-box { border: 1px solid #334155; padding: 9px 12px; border-radius: 4px; line-height: 1.65; font-size: 12px; background: #ffffff; margin-top: 5px; margin-bottom: 8px; text-align: justify; word-break: break-word; }
    .given-box { border: 1.5px solid #0f172a; padding: 8px 12px; background: #f8fafc; font-size: 12px; line-height: 1.6; margin-bottom: 8px; border-radius: 4px; }
    .type-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; font-weight: 600; color: #334155; cursor: pointer; }
    .type-chip input:checked + span { color: #0f172a; font-weight: 800; }
    .count-badge { font-size: 11px; color: #0e7490; background: #ecfeff; border: 1px solid #a5f3fc; padding: 1px 7px; border-radius: 9999px; font-weight: 800; }
    .passage-chip { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; font-weight: 700; color: #334155; cursor: pointer; }
    .p-badge { font-size: 11px; background: #0f172a; color: #38bdf8; border: 1px solid #0284c7; padding: 1px 8px; border-radius: 9999px; font-weight: 800; }

    .filter-diff-btn { padding: 7px 18px; font-size: 12px; font-weight: 700; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #ffffff; color: #475569; cursor: pointer; }

    .nav-item { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; color: #94a3b8; }

      '함축의미': '다음 글의 밑줄 친 부분이 의미하는 바로 가장 적절한 것은?',
      '빈칸': '다음 빈칸에 들어갈 말로 가장 적절한 것은?',
      '순서': '주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?',
      '삽입': '글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?',
      '어법': '다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?',
      '어휘': '다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?',
      '서술형': '[주관식 서술형] 다음 글을 읽고 [조건]에 맞추어 알맞은 답안을 작성하시오.',
      '단답형': '[주관식 단답형] 다음 글의 빈칸에 들어갈 알맞은 단어를 본문에서 찾아 쓰시오.'
    };

    function getStoredApiKey() { return (localStorage.getItem('SDH_GEMINI_API_KEY') || '').trim(); }
    function checkApiKeyStatus() {
      const key = getStoredApiKey(), badge = document.getElementById('apiKeyStatusBadge');
      if (badge) {
        if (key && key.length > 20) { badge.className = 'text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold'; badge.innerText = 'Gemini API Key 연결됨'; }
        else { badge.className = 'text-xs bg-rose-100 text-rose-800 px-3 py-1 rounded-full font-bold cursor-pointer'; badge.innerText = 'API Key 미설정 (클릭)'; }
      }
    }
    function toggleApiKeyModal() { document.getElementById('apiKeyModal')?.classList.toggle('hidden'); }
    function saveApiKey() {
      const input = document.getElementById('inputApiKey').value.trim();
      if (!input) return alert('API Key를 입력하세요.');
      localStorage.setItem('SDH_GEMINI_API_KEY', input);
      toggleApiKeyModal(); checkApiKeyStatus(); alert('API Key 저장 완료!');
    }

    async function callGeminiUniversal(apiKey, prompt) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1, responseMimeType: "application/json" } })
      });
      if (res.ok) return (await res.json()).candidates[0].content.parts[0].text;
      throw new Error('API 통신 실패');
    }

    // 🎯 로그인 정상화 처리

      if (e) e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pw = document.getElementById('loginPw').value.trim();

    function handleLogout() {

    function checkLoggedUserSession() {
      const saved = sessionStorage.getItem('SDH_LOGGED_USER');
      if (saved) {

    function updateSidebarRoleUI() {
      if (!currentUser) return;
      document.getElementById('currentUserName').innerText = currentUser.name;
    }

    function processVerifiedQuestion(item, origPassage, qType, setKey, passageNum, idx) {
      let finalTitle = standardTitleMap[qType] || `다음 글의 ${qType}으로 가장 적절한 것은?`;
      let finalPassage = origPassage, givenBoxText = '', conditionText = '', summaryText = '';

      if (qType === '어법' || qType === '어휘') {
        if (Array.isArray(item.target_words) && item.target_words.length === 5) {
          let p = origPassage;
          item.target_words.forEach((w, i) => {
            const sym = ['①', '②', '③', '④', '⑤'][i];
            p = p.replace(w.orig || w, `${sym} <u>${w.mod || w.orig || w}</u>`);
          });
          finalPassage = p;
        }
      } else if (qType === '빈칸' || qType === '단답형') {
        if (item.target_blank_word && origPassage.includes(item.target_blank_word)) {
          finalPassage = origPassage.replace(item.target_blank_word, '__________');
        } else {
          finalPassage = origPassage.replace(/(\w+){1}(\s+\w+){0,2}$/, '__________');
        }
      } else if (qType === '함축의미') {
        if (item.target_phrase && origPassage.includes(item.target_phrase)) {
          finalPassage = origPassage.replace(item.target_phrase, `<u>${item.target_phrase}</u>`);
        }
      } else if (qType === '순서') {
        const sentences = origPassage.split('. ');
        givenBoxText = sentences.slice(0, 2).join('. ') + '.';
        const remainPart = sentences.slice(2).join('. ');
        const third = Math.floor(remainPart.length / 3);
        finalPassage = `(A) ${remainPart.substring(0, third)}\n(B) ${remainPart.substring(third, third*2)}\n(C) ${remainPart.substring(third*2)}`;
      } else if (qType === '삽입') {
        givenBoxText = item.given_sentence || '주어진 문장 예시';
        const s = origPassage.split('. ');
        if (s.length >= 5) {
          finalPassage = `${s[0]}. ( ① ) ${s[1]}. ( ② ) ${s[2]}. ( ③ ) ${s[3]}. ( ④ ) ${s[4]}. ( ⑤ ) ${s.slice(5).join('. ')}`;
        }
      } else if (qType === '서술형') {
        conditionText = item.condition_text || '[조건] 본문에서 알맞은 단어를 찾아 문맥에 맞게 쓰시오.';
        summaryText = item.summary_text || 'Summary: The passage indicates that __________ is essential.';
      }

      return {
        id: `Q-${setKey}-${passageNum}-${qType}-${idx+1}-${Math.random().toString(36).substring(2,7)}`,
        passage_num: passageNum, type: qType, difficulty: '중',
        title: finalTitle, passage: finalPassage,
        given_box: givenBoxText, condition_box: conditionText, summary_box: summaryText,
        options: Array.isArray(item.options) ? item.options : [],
        answer: item.answer || '①', explanation: item.explanation || '본문의 핵심 문맥에 따른 해설입니다.'
      };
    }

    async function executeFastParallelGenerate() {
      const apiKey = getStoredApiKey();
      if (!apiKey) return alert('API Key를 설정하세요.');
      const setKey = document.getElementById('selectMockSet').value;
      if (!setKey) return alert('모의고사 세트를 선택하세요.');

      const targetPassages = passageArchiveDB.filter(p => `${p.year}-${p.month}-${p.grade}` === setKey);
      const selectedTypes = Array.from(document.querySelectorAll('input[name="adminGenType"]:checked')).map(cb => cb.value);
      const logBox = document.getElementById('generationLogBox');

      logBox.classList.remove('hidden');
      logBox.innerHTML = `<div>🚀 완전 검증 출제 가동 (${setKey})...</div>`;

      await supabaseClient.from('generated_questions').delete().like('id', `Q-${setKey}-%`);
      generatedQuestionsPool = generatedQuestionsPool.filter(q => !q.id.startsWith(`Q-${setKey}-`));

      let totalCount = 0;
      for (let pObj of targetPassages) {
        const prompt = `
당신은 대한민국 고등학교 영어 내신 출제 전문가입니다.
아래 [영어 지문]에 대해 [요청 유형들]의 정밀 변형 데이터를 JSON 배열로 출제하십시오.

[영어 지문 (${pObj.passage_num}번)]:
${pObj.text}

[요청 유형들]:
${selectedTypes.join(', ')}

JSON 출력 예시:
[
  {
    "type": "어법",
    "target_words": [{"orig":"efficient", "mod":"efficiently"}],
    "options": ["① efficient", "② efficiently", "③ tripled", "④ doubled", "⑤ desired"],
    "answer": "②",
    "explanation": "상세 어법 해설"
  }
]
`;
        try {
          const rawJson = await callGeminiUniversal(apiKey, prompt);
          let cleanedJson = rawJson.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleanedJson);
          if (Array.isArray(parsed)) {
            const verifiedItems = parsed.map((item, idx) => processVerifiedQuestion(item, pObj.text, item.type || selectedTypes[0], setKey, pObj.passage_num, idx));
            await supabaseClient.from('generated_questions').upsert(verifiedItems);
            generatedQuestionsPool.unshift(...verifiedItems);
            totalCount += verifiedItems.length;
            logBox.innerHTML += `<div class="text-emerald-300">✓ ${pObj.passage_num}번 지문 적재 완료 (+${verifiedItems.length}문항)</div>`;
          }
        } catch (e) { console.error(e); }
      }
      logBox.innerHTML += `<div class="text-emerald-300 font-bold mt-2">🎉 출제 완료! 총 ${totalCount}문항 적재</div>`;
      alert('🎉 출제 완료!');
      loadAllSupabaseData();
    }

    function renderPaper() {
      const qContainer = document.getElementById('paperContent');
      const quickGrid = document.getElementById('quickAnswerGrid');
      const aContainer = document.getElementById('answerDetailContent');

      if (!qContainer) return;

      qContainer.innerHTML = filteredQuestions.map((q, idx) => {
        const isSubjective = (q.type === '서술형' || q.type === '단답형');
        return `
          <div class="question-block exam-paper-font text-slate-900 leading-relaxed text-[12.5px]">
            <div class="font-bold text-[13.5px] mb-1">
              <span>${idx + 1}. ${q.title}</span>
              <span class="text-[10px] text-slate-500 font-sans ml-1">[${q.passage_num}번 / ${q.type}]</span>
            </div>
            ${q.given_box ? `<div class="given-box exam-eng-font font-medium"><strong>[주어진 글 / 문장]</strong><br/>${q.given_box}</div>` : ''}
            <div class="passage-box exam-eng-font text-slate-800">${q.passage.replace(/\n/g, '<br/>')}</div>
            ${isSubjective ? `
              ${q.condition_box ? `<div class="text-[11px] font-bold text-slate-800 my-1">${q.condition_box}</div>` : ''}
              ${q.summary_box ? `<div class="p-2 border bg-slate-50 font-sans text-xs my-1"><strong>[요약문]</strong><br/>${q.summary_box}</div>` : ''}
              <div class="mt-2 border p-3 rounded bg-white font-sans"><span class="text-[11px] font-bold text-slate-700 block mb-1">[서술형 답안 작성란]</span><div class="border-b border-dashed h-5"></div></div>
            ` : ''}
            ${(!isSubjective && q.options.length > 0) ? `<div class="grid grid-cols-1 gap-1 pl-1 mt-2 text-[12px] exam-eng-font">${q.options.map(o => `<div>${o}</div>`).join('')}</div>` : ''}
          </div>
        `;
      }).join('');

      if (quickGrid) {
        quickGrid.innerHTML = filteredQuestions.map((q, idx) => `
          <div class="border p-1 rounded bg-white h-10 flex flex-col justify-center items-center">
            <span class="text-[9px] text-slate-400 font-bold">${idx + 1}번</span>
            <span class="font-black text-xs">${(q.type === '서술형' || q.type === '단답형') ? '서술형' : q.answer}</span>
          </div>
        `).join('');
      }

      if (aContainer) {
        aContainer.innerHTML = filteredQuestions.map((q, idx) => `
          <div class="question-block border-b pb-2 mb-2">
            <div class="font-bold text-slate-900 mb-1">[${idx + 1}번 정답 : <strong class="text-blue-700">${q.answer}</strong>]</div>
            <div class="text-[11px] text-slate-700 font-sans bg-slate-50 p-2 rounded">${q.explanation}</div>
          </div>
        `).join('');
      }
    }

    function renderExamTable() {
      const tbody = document.getElementById('examTableBody');
      if (tbody) tbody.innerHTML = mockExams.map(e => `
        <tr class="hover:bg-slate-50">
          <td class="py-3.5 px-6">${e.year}년</td><td class="py-3.5 px-6">${e.month}월</td><td class="py-3.5 px-6 font-bold text-slate-900">${e.title}</td>
          <td class="py-3.5 px-6 font-bold text-cyan-600 text-center">${e.questionCount}문항</td>
          <td class="py-3.5 px-6 text-center"><button onclick="openExamTypeSelector('${e.id}')" class="text-cyan-600 font-bold p-2"><i class="fa-solid fa-folder-open text-lg"></i></button></td>
        </tr>
      `).join('');
    }

    function openExamTypeSelector(examId) {
      currentSelectedExam = mockExams.find(e => e.id === examId) || mockExams[0];
      switchView('typeSelect');
    }

    function generateExamPaper() {
      filteredQuestions = generatedQuestionsPool.filter(q => currentSelectedExam && q.id.includes(currentSelectedExam.id)).slice(0, 50);
      renderPaper();
      switchView('paperView');
    }

    function switchView(v) {
      ['examList', 'adminPanel', 'mockRegisterPanel', 'typeSelect', 'paperView', 'pdfParserPanel', 'myPage'].forEach(id => {
        document.getElementById('view-' + id)?.classList.add('hidden');
        document.getElementById('nav-' + id)?.classList.remove('active-nav');
      });
      document.getElementById('view-' + v)?.classList.remove('hidden');
      document.getElementById('nav-' + v)?.classList.add('active-nav');
    }

    function initDropdownOptions() {
      const years = Array.from({length: 12}, (_, i) => 2026 - i);
      const months = [3, 4, 5, 6, 7, 9, 10, 11, 12];
      const grades = [1, 2, 3];

      const regYearEl = document.getElementById('regYear');
      const regMonthEl = document.getElementById('regMonth');
      const regGradeEl = document.getElementById('regGrade');

      if (regYearEl) regYearEl.innerHTML = years.map(y => `<option value="${y}" ${y===2024?'selected':''}>${y}년</option>`).join('');
      if (regMonthEl) regMonthEl.innerHTML = months.map(m => `<option value="${m}" ${m===3?'selected':''}>${m}월</option>`).join('');
      if (regGradeEl) regGradeEl.innerHTML = grades.map(g => `<option value="${g}" ${g===1?'selected':''}>고${g}</option>`).join('');

      const filterYearEl = document.getElementById('filterYear');
      const filterMonthEl = document.getElementById('filterMonth');
      const filterGradeEl = document.getElementById('filterGrade');

      if (filterYearEl) filterYearEl.innerHTML = `<option value="">년도 전체</option>` + years.map(y => `<option value="${y}">${y}년</option>`).join('');
      if (filterMonthEl) filterMonthEl.innerHTML = `<option value="">월 전체</option>` + months.map(m => `<option value="${m}">${m}월</option>`).join('');
      if (filterGradeEl) filterGradeEl.innerHTML = `<option value="">학년 전체</option>` + grades.map(g => `<option value="${g}">고${g}</option>`).join('');
    }

    function render25PassageInputForms() {
      const c = document.getElementById('passageInputsContainer');
      if (c) c.innerHTML = passageNumberList.map(n => `<textarea id="inputP_${n}" rows="3" class="w-full p-2 border text-xs font-mono" placeholder="${n}번 영어 지문 복사..."></textarea>`).join('');
    }

    async function saveAll25Passages() {
      const year = document.getElementById('regYear')?.value || '2024';
      const month = document.getElementById('regMonth')?.value || '6';
      const grade = document.getElementById('regGrade')?.value || '1';
      const upsertData = [];
      passageNumberList.forEach(num => {
        const text = document.getElementById(`inputP_${num}`)?.value.trim();
        if (text) upsertData.push({ key: `${year}-${month}-${grade}-${num}`, year, month, grade, passage_num: num, sample: text.substring(0, 30) + '...', text });
      });
      if (upsertData.length > 0) {
        await supabaseClient.from('passage_archive').upsert(upsertData);
        alert('🎉 지문 DB 저장 완료!');
        loadAllSupabaseData();
      }
    }

    function renderPassageArchiveTable() {
      const tbody = document.getElementById('passageArchiveTableBody'), totalArchived = document.getElementById('totalArchivedCount');
      if (totalArchived) totalArchived.innerText = passageArchiveDB.length;
      if (tbody) tbody.innerHTML = passageArchiveDB.map(p => `
        <tr class="hover:bg-slate-50">
          <td class="py-2 px-4 text-center font-bold">${p.year}년</td><td class="py-2 px-4 text-center">${p.month}월</td>
          <td class="py-2 px-4 text-center font-bold text-teal-700">고${p.grade}</td><td class="py-2 px-4 text-center font-black text-slate-900">${p.passage_num}번</td>
          <td class="py-2 px-4 font-mono text-slate-600 truncate max-w-xs">${p.sample}</td><td class="py-2 px-4 text-center text-emerald-600 font-bold">등록완료</td>
          <td class="py-2 px-4 text-center"><button onclick="deleteSinglePassage('${p.key}')" class="text-rose-600 hover:underline">삭제</button></td>
        </tr>
      `).join('');
      updateMockSetDropdown();
    }

    function updateMockSetDropdown() {
      const selectEl = document.getElementById('selectMockSet'), setMap = {};
      passageArchiveDB.forEach(p => { const k = `${p.year}-${p.month}-${p.grade}`; setMap[k] = (setMap[k] || 0) + 1; });
      if (selectEl) selectEl.innerHTML = '<option value="">-- 모의고사 세트 선택 --</option>' + Object.keys(setMap).map(k => `<option value="${k}">[${k}] 모의고사 세트 (${setMap[k]}개 지문)</option>`).join('');
    }

    async function deleteSinglePassage(key) {
      await supabaseClient.from('passage_archive').delete().eq('key', key);
      passageArchiveDB = passageArchiveDB.filter(p => p.key !== key);
      renderPassageArchiveTable();
    }

    async function loadAllSupabaseData() {
      const { data: pData } = await supabaseClient.from('passage_archive').select('*').order('created_at', { ascending: false });
      if (pData) passageArchiveDB = pData;
      renderPassageArchiveTable();

      const { data: qData } = await supabaseClient.from('generated_questions').select('*').order('created_at', { ascending: false });
      if (qData) {
        generatedQuestionsPool = qData;
        const examMap = {};
        passageArchiveDB.forEach(p => {
          const k = `${p.year}-${p.month}-${p.grade}`;
          if (!examMap[k]) examMap[k] = { id: k, year: p.year, month: p.month, title: `${p.year}년 ${p.month}월 학력평가`, questionCount: 0 };
        });
        qData.forEach(q => {
          const parts = q.id.split('-');
          if (parts.length > 3) {
            const k = `${parts[1]}-${parts[2]}-${parts[3]}`;
            if (examMap[k]) examMap[k].questionCount++;
          }
        });
        mockExams = Object.values(examMap);
        renderExamTable();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkLoggedUserSession();
      initDropdownOptions();
      render25PassageInputForms();
      checkApiKeyStatus();
    });
  </script>
